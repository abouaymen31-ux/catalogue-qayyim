<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inventaire Qayyim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap">
<style>
/* Page d'inventaire : liste de tous les produits avec une quantité à saisir.
   Les quantités restent dans le navigateur de l'appareil (rien n'est envoyé en ligne). */
:root{
  --paper:#fffcf5; --card:#ffffff; --ink:#141414; --muted:#6b6457; --line:#ebe1cb;
  --accent:#7b663a; --accent-soft:#f7eeda; --gold:#b08d57; --band:#111111; --band-fg:#fffcf5; --band-muted:#c9bfa9;
  --warn:#9b3a2a; --warn-soft:#fbeae5; --ok:#3d6b3a; --focus:#b08d57;
  --f:"Raleway",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121110; --card:#1c1a17; --ink:#f5efe2; --muted:#a79e8c; --line:#37322a;
  --accent:#e3c996; --accent-soft:#2c2618; --gold:#e3c996; --band:#000000; --band-fg:#fffcf5; --band-muted:#b5ab97;
  --warn:#e8806c; --warn-soft:#33201b; --ok:#9cc797; --focus:#e3c996; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--paper);margin:0}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-weight:700;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#141414;font-weight:700}
.btn.ghost{background:transparent;color:var(--band-fg);border-color:rgba(255,255,255,.3)}

.mast{border-bottom:3px solid var(--gold)}
.mast .wrap{padding-block:24px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);margin-bottom:6px}
.mast h1{font-size:clamp(26px,4vw,36px);line-height:1.1}
.mast p{margin:6px 0 0;color:var(--muted);max-width:64ch}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-block:16px 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert b{color:var(--warn)}

.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px}
.bar select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px;max-width:100%}

main.wrap{padding-block:8px 110px}
.rayon h2{font-size:22px;border-bottom:2px solid var(--ink);padding:18px 0 8px;margin-bottom:8px;display:flex;align-items:baseline;gap:10px}
.rayon h2 span{font-size:13px;font-weight:500;color:var(--muted)}
.sub{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:14px 0 6px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.row.done{border-color:var(--gold)}
.row.diff{border-color:var(--warn);background:var(--warn-soft)}
.row img,.row .ph{width:52px;height:52px;border-radius:7px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.nm{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.info{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px}
.info .out{color:var(--warn);font-weight:600}
.info .low{color:var(--accent);font-weight:600}
.todo{font-size:12.5px;font-weight:700;color:var(--warn);margin-top:3px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:20px;font-weight:600;cursor:pointer;line-height:1}
.qty button:hover{border-color:var(--ink)}
.qty input{width:62px;height:38px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.row.done .qty input{border-color:var(--gold);background:var(--accent-soft)}
.note{grid-column:2 / -1;width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 0;font-size:13px}
.note::placeholder{color:var(--muted);opacity:.8}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--band);color:var(--band-fg);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{padding-block:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dock .txt{flex:1 1 160px;min-width:0;font-size:13.5px;color:var(--band-muted)}
.dock .txt b{color:var(--band-fg);font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
@media (max-width:520px){
  .row{grid-template-columns:44px minmax(0,1fr)}
  .row img,.row .ph{width:44px;height:44px}
  .qty{grid-column:1 / -1;justify-content:flex-end}
  .note{grid-column:1 / -1}
}
@media print{
  .bar,.dock,.qty button,.mast p,.btn{display:none!important}
  .bar{position:static}
  body{font-size:11px;background:#fff;color:#000}
  .row{break-inside:avoid;padding:3px 6px;margin-bottom:2px;border-color:#bbb;background:#fff!important;grid-template-columns:minmax(0,1fr) auto}
  .row img,.row .ph{display:none}
  .qty input{height:22px;width:50px;font-size:12px;border-color:#000;background:#fff!important}
  .note{grid-column:1 / -1}
  main.wrap{padding-bottom:0}
}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div>
      <div class="eyebrow">Qayyim · usage interne</div>
      <h1>Inventaire</h1>
      <p>Saisissez la quantité comptée pour chaque produit. Tout s'enregistre automatiquement sur cet appareil, au fur et à mesure.</p>
    </div>
    <a class="btn" href="./">← Catalogue</a>
  </div>
</header>

<div class="wrap stats" id="stats"></div>

<div class="bar">
  <div class="wrap">
    <input type="search" id="q" placeholder="Rechercher un produit" aria-label="Rechercher un produit" autocomplete="off">
    <select id="rayon" aria-label="Rayon"></select>
    <select id="show" aria-label="Produits à afficher">
      <option value="all">Tous les produits</option>
      <option value="todo">Restant à compter</option>
      <option value="done">Déjà comptés</option>
      <option value="diff">À corriger sur le site</option>
    </select>
  </div>
</div>

<main class="wrap" id="list"><p class="empty">Chargement du catalogue…</p></main>

<div class="dock">
  <div class="wrap">
    <span class="txt" id="dock-txt"></span>
    <button type="button" class="btn ghost" id="reset">Nouvel inventaire</button>
    <button type="button" class="btn ghost" id="print">Imprimer</button>
    <button type="button" class="btn primary" id="export">Télécharger pour Excel</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => n.toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";

/* quantités comptées : {identifiant produit: {q: nombre, n: note}} — gardées dans le navigateur */
const KEY = "qayyim:inventaire";
let inv = {}, started = null;
try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); inv = s.items || {}; started = s.started || null; } catch (e) {}
let canSave = true;
function save() {
  if (!started) started = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify({started, items: inv})); }
  catch (e) { if (canSave) toast("Attention : l'enregistrement est bloqué sur ce navigateur"); canSave = false; }
}

let P = [], RAY = [], rows = [];
const counted = p => inv[p.id] && inv[p.id].q != null;
/* écart entre le comptage et ce qu'affiche le site */
function todo(p) {
  if (!counted(p)) return "";
  const q = inv[p.id].q;
  if (q === 0 && p.stock) return "À mettre en rupture sur le site";
  if (q > 0 && !p.stock) return "À remettre en vente sur le site";
  return "";
}
const siteTxt = p => !p.stock ? `<span class="out">Rupture sur le site</span>` : p.low ? `<span class="low">Stock bas sur le site : ${p.low}</span>` : `<span>En vente sur le site</span>`;

function build() {
  const root = $("#list"); root.innerHTML = ""; rows = [];
  $("#rayon").innerHTML = `<option value="all">Tous les rayons</option>` + RAY.map(r => `<option value="${r.k}">${esc(r.name)}</option>`).join("");
  for (const r of RAY) {
    const sec = document.createElement("section"); sec.className = "rayon";
    sec.innerHTML = `<h2>${esc(r.name)} <span></span></h2>`;
    const secObj = {el: sec, count: sec.querySelector("span"), items: [], subs: []};
    for (const s of r.subs) {
      const items = P.filter(p => p.r === r.k && p.s === s).sort((a, b) => a.name.localeCompare(b.name, "fr", {sensitivity: "base"}));
      if (!items.length) continue;
      const h = document.createElement("div"); h.className = "sub"; h.textContent = s; sec.appendChild(h);
      const sub = {el: h, rows: []};
      for (const p of items) {
        const el = document.createElement("div"); el.className = "row";
        const opts = p.opts.map(o => o.n + " : " + o.v.join(", ")).join(" · ");
        el.innerHTML = (p.img ? `<img loading="lazy" src="${p.img}" alt="">` : `<span class="ph"></span>`) +
          `<div><div class="nm">${esc(p.name)}</div><div class="info">${p.price != null ? `<span>${eur(p.price)}</span>` : ""}${siteTxt(p)}${p.sku ? `<span>Réf. ${esc(p.sku)}</span>` : ""}</div>` +
          `${opts ? `<div class="info">${esc(opts)}</div>` : ""}<div class="todo" hidden></div></div>` +
          `<div class="qty"><button type="button" data-d="-1" aria-label="Retirer 1">−</button>` +
          `<input type="text" inputmode="numeric" placeholder="–" aria-label="Quantité comptée pour ${esc(p.name)}">` +
          `<button type="button" data-d="1" aria-label="Ajouter 1">+</button></div>` +
          `<input class="note" type="text" maxlength="160" placeholder="${opts ? "Détail par variante ou remarque (ex. rouge 2, noir 3)" : "Remarque (facultatif)"}" aria-label="Remarque pour ${esc(p.name)}">`;
        const row = {el, p, qty: el.querySelector(".qty input"), note: el.querySelector(".note"), todo: el.querySelector(".todo")};
        row.qty.value = counted(p) ? inv[p.id].q : "";
        row.note.value = (inv[p.id] && inv[p.id].n) || "";
        row.qty.addEventListener("input", () => {
          const t = row.qty.value.replace(/\D/g, ""); if (t !== row.qty.value) row.qty.value = t;
          setQty(row, t === "" ? null : Math.min(99999, parseInt(t, 10)));
        });
        el.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => {
          const q = Math.max(0, (counted(p) ? inv[p.id].q : 0) + Number(b.dataset.d));
          row.qty.value = q; setQty(row, q);
        }));
        row.note.addEventListener("input", () => {
          const e = inv[p.id] || (inv[p.id] = {q: null, n: ""}); e.n = row.note.value;
          if (e.q == null && !e.n) delete inv[p.id];
          save();
        });
        paint(row); sec.appendChild(el); rows.push(row); sub.rows.push(row); secObj.items.push(row);
      }
      secObj.subs.push(sub);
    }
    root.appendChild(sec); sections.push(secObj);
  }
  const empty = document.createElement("p"); empty.className = "empty"; empty.id = "empty"; empty.hidden = true;
  empty.textContent = "Aucun produit ne correspond."; root.appendChild(empty);
}
const sections = [];
function setQty(row, q) {
  const e = inv[row.p.id] || (inv[row.p.id] = {q: null, n: ""}); e.q = q;
  if (e.q == null && !e.n) delete inv[row.p.id];
  save(); paint(row); summary();
}
function paint(row) {
  const t = todo(row.p);
  row.el.classList.toggle("done", counted(row.p) && !t);
  row.el.classList.toggle("diff", !!t);
  row.todo.textContent = t; row.todo.hidden = !t;
}
function summary() {
  const done = P.filter(counted), pieces = done.reduce((s, p) => s + inv[p.id].q, 0);
  const value = done.reduce((s, p) => s + inv[p.id].q * (p.price || 0), 0), diffs = P.filter(todo).length;
  $("#stats").innerHTML =
    `<div class="stat"><b>${done.length} / ${P.length}</b><span>produits comptés</span></div>` +
    `<div class="stat"><b>${pieces.toLocaleString("fr-FR")}</b><span>pièces en stock</span></div>` +
    `<div class="stat"><b>${eur(value)}</b><span>valeur au prix de vente</span></div>` +
    `<div class="stat${diffs ? " alert" : ""}"><b>${diffs}</b><span>à corriger sur le site</span></div>`;
  $("#dock-txt").innerHTML = `<b>${done.length} / ${P.length}</b> comptés` + (started ? ` · commencé le ${new Date(started).toLocaleDateString("fr-FR")}` : "");
  for (const s of sections) s.count.textContent = `${s.items.filter(r => counted(r.p)).length} / ${s.items.length} comptés`;
}
function filter() {
  const q = norm($("#q").value.trim()).split(/\s+/).filter(Boolean), r = $("#rayon").value, show = $("#show").value;
  let any = false;
  for (const s of sections) {
    let secVis = false;
    for (const sub of s.subs) {
      let subVis = false;
      for (const row of sub.rows) {
        const p = row.p;
        const v = (r === "all" || p.r === r) && q.every(w => p.key.includes(w)) &&
          (show === "all" || (show === "todo" && !counted(p)) || (show === "done" && counted(p)) || (show === "diff" && todo(p)));
        row.el.hidden = !v; subVis = subVis || v;
      }
      sub.el.hidden = !subVis; secVis = secVis || subVis;
    }
    s.el.hidden = !secVis; any = any || secVis;
  }
  $("#empty").hidden = any;
}

/* export pour Excel : fichier CSV avec « ; » comme séparateur */
function exportCsv() {
  const cell = v => { v = String(v == null ? "" : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const num = n => n == null ? "" : n.toFixed(2).replace(".", ",");
  const rname = Object.fromEntries(RAY.map(r => [r.k, r.name]));
  const lines = [["Rayon", "Sous-catégorie", "Produit", "Référence", "Prix public (€)", "Quantité comptée", "Valeur (€)", "Remarque", "État sur le site", "À corriger"]];
  for (const row of rows) {
    const p = row.p, e = inv[p.id] || {};
    lines.push([rname[p.r], p.s, p.name, p.sku, num(p.price), e.q == null ? "" : e.q, e.q == null || p.price == null ? "" : num(e.q * p.price),
      e.n || "", p.stock ? (p.low ? "Stock bas (" + p.low + ")" : "En vente") : "Rupture", todo(p)]);
  }
  const csv = "﻿" + lines.map(l => l.map(cell).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
  a.download = "inventaire-qayyim-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Fichier téléchargé");
}
let toastT; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

$("#q").addEventListener("input", filter);
$("#rayon").addEventListener("change", filter);
$("#show").addEventListener("change", filter);
$("#export").addEventListener("click", exportCsv);
$("#print").addEventListener("click", () => window.print());
$("#reset").addEventListener("click", () => {
  const b = $("#reset");
  if (b.dataset.confirm) {
    inv = {}; started = null; try { localStorage.removeItem(KEY); } catch (e) {}
    rows.forEach(r => { r.qty.value = ""; r.note.value = ""; paint(r); });
    summary(); filter(); b.textContent = "Nouvel inventaire"; delete b.dataset.confirm; toast("Inventaire remis à zéro"); return;
  }
  if (!Object.keys(inv).length) return;
  b.dataset.confirm = "1"; b.textContent = "Tout effacer ? Confirmer";
  setTimeout(() => { b.textContent = "Nouvel inventaire"; delete b.dataset.confirm; }, 4000);
});

fetch("data/catalogue.json", {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  RAY = d.rayons; P = d.products.filter(p => !p.gone);
  const rname = Object.fromEntries(RAY.map(r => [r.k, r.name]));
  P.forEach(p => p.key = norm([p.name, p.s, rname[p.r], p.sku, p.opts.map(o => o.v.join(" ")).join(" ")].join(" ")));
  build(); summary(); filter();
}).catch(() => { $("#list").innerHTML = `<p class="empty">Le catalogue n'a pas pu être chargé. Vérifiez la connexion puis rechargez la page.</p>`; });
</script>
</body>
</html>
